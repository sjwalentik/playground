<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text-to-Speech UI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🎙️ Text-to-Speech</h1>
        <div class="input-group">
            <textarea id="textInput" placeholder="Enter text to convert to speech..." rows="5"></textarea>
        </div>
        <div class="controls">
            <div class="control-group">
                <label for="voiceSelect">Voice:</label>
                <select id="voiceSelect"></select>
            </div>
            <div class="control-group">
                <label for="rate">Rate: <span id="rateValue">1.0</span>x</label>
                <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
            </div>
            <div class="control-group">
                <label for="pitch">Pitch: <span id="pitchValue">1</span></label>
                <input type="range" id="pitch" min="0.5" max="2" step="0.1" value="1">
            </div>
        </div>
        <div class="button-group">
            <button id="speakBtn">🎤 Speak</button>
            <button id="pauseBtn" disabled>⏸️ Pause</button>
            <button id="resumeBtn" disabled>⏹️ Resume</button>
            <button id="stopBtn" disabled>⏹️ Stop</button>
        </div>
        <div id="status" class="status">Ready to speak!</div>
    </div>
    <script src="app.js"></script>
</body>
</html>
