<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech-to-Text UI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🎙️ Speech-to-Text</h1>
        <div class="controls">
            <button id="startBtn">🎙️ Start Listening</button>
            <button id="stopBtn" disabled>⏹️ Stop Listening</button>
        </div>
        <div class="output-area">
            <textarea id="transcription" readonly placeholder="Your speech will appear here..."></textarea>
            <div class="action-buttons">
                <button id="copyBtn" disabled>📋 Copy Text</button>
                <button id="clearBtn" disabled>🧹 Clear Text</button>
            </div>
        </div>
        <div id="status" class="status">Ready to listen...</div>
        <div id="error" class="error" style="display:none"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
