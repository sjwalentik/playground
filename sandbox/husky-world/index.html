<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Husky World - Pack Edition</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #instructions {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #ffffff;
      background: rgba(18, 25, 40, 0.45);
      font-size: 1rem;
      line-height: 1.6;
      letter-spacing: 0.015em;
      z-index: 10;
      pointer-events: none;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.65);
    }

    #instructions.hidden {
      display: none;
    }

    .pet-feedback {
      position: fixed;
      left: 0;
      top: 0;
      pointer-events: none;
      color: #fff6cf;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.65);
      transform: translate(-50%, -50%);
      z-index: 9;
      white-space: nowrap;
      opacity: 0;
    }

    .pack-status {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      z-index: 5;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .pack-status.active {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="instructions">
    Click to start<br>
    W / A / S / D: Move<br>
    Mouse: Look around<br>
    Esc: Release mouse<br>
    <br>
    🐕 The pack will follow you, zoom together, and hang out as a group!
  </div>
  <div id="packStatus" class="pack-status"></div>
  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.161.0/build/three.module.js";

    const scene = new THREE.Scene();

    const skyCanvas = document.createElement("canvas");
    skyCanvas.width = 2;
    skyCanvas.height = 512;
    const skyContext = skyCanvas.getContext("2d");
    const skyGradient = skyContext.createLinearGradient(0, 0, 0, skyCanvas.height);
    skyGradient.addColorStop(0, "#7ec5f3");
    skyGradient.addColorStop(1, "#dff3ff");
    skyContext.fillStyle = skyGradient;
    skyContext.fillRect(0, 0, skyCanvas.width, skyCanvas.height);
    const skyTexture = new THREE.CanvasTexture(skyCanvas);
    skyTexture.colorSpace = THREE.SRGBColorSpace;
    scene.background = skyTexture;
    scene.fog = new THREE.Fog(0xc8e4f5, 60, 240);

    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(0, 1.7, 0);
    camera.lookAt(0, 1.7, -1);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const canvas = renderer.domElement;
    const instructions = document.getElementById("instructions");
    const packStatus = document.getElementById("packStatus");
    const playerHeight = 1.7;
    const walkSpeed = 5;
    const lookSensitivity = 0.002;
    const maxPitch = THREE.MathUtils.degToRad(85);
    const movementDirection = new THREE.Vector3();
    const forward = new THREE.Vector3();
    const right = new THREE.Vector3();
    const clock = new THREE.Clock();
    const keyState = {
      KeyW: false,
      KeyA: false,
      KeyS: false,
      KeyD: false
    };
    const raycaster = new THREE.Raycaster();
    const clickNdc = new THREE.Vector2();
    const dogs = [];
    const dogMeshes = [];
    const floatingTexts = [];
    const tempVector = new THREE.Vector3();
    const tempVector2 = new THREE.Vector3();
    const packCenter = new THREE.Vector3(0, 0, 0);

    let yaw = 0;
    let pitch = 0;
    let elapsedSeconds = 0;
    let nextPlayTime = THREE.MathUtils.randFloat(8, 14);
    let nextZoomieTime = THREE.MathUtils.randFloat(15, 25);
    let nextFollowRepositionTime = THREE.MathUtils.randFloat(30, 45);
    let audioContext = null;
    let barkNoiseBuffer = null;

    camera.rotation.order = "YXZ";

    function setInstructionVisibility() {
      instructions.classList.toggle("hidden", document.pointerLockElement === canvas);
    }

    function clearMovementKeys() {
      Object.keys(keyState).forEach((key) => {
        keyState[key] = false;
      });
    }

    function onPointerLockChange() {
      if (document.pointerLockElement !== canvas) {
        clearMovementKeys();
      }
      setInstructionVisibility();
    }

    function onMouseMove(event) {
      if (document.pointerLockElement !== canvas) {
        return;
      }

      yaw -= event.movementX * lookSensitivity;
      pitch -= event.movementY * lookSensitivity;
      pitch = THREE.MathUtils.clamp(pitch, -maxPitch, maxPitch);

      camera.rotation.y = yaw;
      camera.rotation.x = pitch;
    }

    function onKeyChange(event, isPressed) {
      if (event.code === "Escape" && document.pointerLockElement === canvas) {
        document.exitPointerLock();
        return;
      }

      if (!(event.code in keyState)) {
        return;
      }

      keyState[event.code] = isPressed;
      if (document.pointerLockElement === canvas) {
        event.preventDefault();
      }
    }

    function onCanvasClick(event) {
      ensureAudioContext();
      try_petDog_from_click(event);
      if (document.pointerLockElement !== canvas) {
        canvas.requestPointerLock();
      }
    }

    function updateMovement(deltaSeconds) {
      if (document.pointerLockElement !== canvas) {
        camera.position.y = playerHeight;
        return;
      }

      movementDirection.set(0, 0, 0);
      forward.set(-Math.sin(yaw), 0, -Math.cos(yaw));
      right.set(Math.cos(yaw), 0, -Math.sin(yaw));

      if (keyState.KeyW) {
        movementDirection.add(forward);
      }
      if (keyState.KeyS) {
        movementDirection.sub(forward);
      }
      if (keyState.KeyD) {
        movementDirection.add(right);
      }
      if (keyState.KeyA) {
        movementDirection.sub(right);
      }

      if (movementDirection.lengthSq() > 0) {
        movementDirection.normalize().multiplyScalar(walkSpeed * deltaSeconds);
        camera.position.add(movementDirection);
      }

      camera.position.y = playerHeight;
    }

    canvas.addEventListener("click", onCanvasClick);
    document.addEventListener("pointerlockchange", onPointerLockChange);
    document.addEventListener("mousemove", onMouseMove);
    document.addEventListener("keydown", (event) => onKeyChange(event, true));
    document.addEventListener("keyup", (event) => onKeyChange(event, false));
    setInstructionVisibility();

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
    directionalLight.position.set(5, 10, 5);
    scene.add(directionalLight);

    const grassCanvas = document.createElement("canvas");
    grassCanvas.width = 256;
    grassCanvas.height = 256;
    const grassContext = grassCanvas.getContext("2d");
    grassContext.fillStyle = "#68a349";
    grassContext.fillRect(0, 0, grassCanvas.width, grassCanvas.height);
    for (let i = 0; i < 900; i += 1) {
      const shade = 80 + Math.floor(Math.random() * 70);
      grassContext.fillStyle = `rgb(${30 + Math.floor(Math.random() * 25)}, ${shade}, ${25 + Math.floor(Math.random() * 20)})`;
      const x = Math.floor(Math.random() * grassCanvas.width);
      const y = Math.floor(Math.random() * grassCanvas.height);
      grassContext.fillRect(x, y, 2, 2);
    }
    const grassTexture = new THREE.CanvasTexture(grassCanvas);
    grassTexture.colorSpace = THREE.SRGBColorSpace;
    grassTexture.wrapS = THREE.RepeatWrapping;
    grassTexture.wrapT = THREE.RepeatWrapping;
    grassTexture.repeat.set(90, 90);
    grassTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(300, 300),
      new THREE.MeshStandardMaterial({
        color: 0x6ca34a,
        map: grassTexture,
        roughness: 0.96,
        metalness: 0.0
      })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    scene.add(ground);

    const marker = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshStandardMaterial({ color: 0xcc5533 })
    );
    marker.position.set(0, 0.5, -5);
    scene.add(marker);

    const trunkGeometry = new THREE.CylinderGeometry(0.2, 0.28, 2.2, 6);
    const foliageGeometry = new THREE.ConeGeometry(1.35, 3.6, 7);

    const trunkMaterials = [
      new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 0.95 }),
      new THREE.MeshStandardMaterial({ color: 0x7b4f2f, roughness: 0.95 }),
      new THREE.MeshStandardMaterial({ color: 0x8a5a34, roughness: 0.95 })
    ];

    const foliageMaterials = [
      new THREE.MeshStandardMaterial({ color: 0x2f7c31, roughness: 0.88 }),
      new THREE.MeshStandardMaterial({ color: 0x3a8a39, roughness: 0.88 }),
      new THREE.MeshStandardMaterial({ color: 0x4a9942, roughness: 0.88 })
    ];

    function createTree() {
      const tree = new THREE.Group();

      const trunk = new THREE.Mesh(
        trunkGeometry,
        trunkMaterials[Math.floor(Math.random() * trunkMaterials.length)]
      );
      trunk.position.y = 1.1;
      tree.add(trunk);

      const foliage = new THREE.Mesh(
        foliageGeometry,
        foliageMaterials[Math.floor(Math.random() * foliageMaterials.length)]
      );
      foliage.position.y = 3.4;
      foliage.rotation.y = Math.random() * Math.PI * 2;
      tree.add(foliage);

      const scale = THREE.MathUtils.randFloat(0.8, 1.3);
      tree.scale.setScalar(scale);

      return tree;
    }

    const treeCount = THREE.MathUtils.randInt(30, 50);
    for (let i = 0; i < treeCount; i += 1) {
      const angle = Math.random() * Math.PI * 2;
      const radius = THREE.MathUtils.randFloat(30, 90);
      const tree = createTree();
      tree.position.set(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
      tree.rotation.y = Math.random() * Math.PI * 2;
      scene.add(tree);
    }

    class Husky {
      constructor({ furColor, whiteColor = 0xf2f2ee, noseColor = 0x1a1a1a }) {
        this.group = new THREE.Group();
        this.bodyRig = new THREE.Group();
        this.group.add(this.bodyRig);
        this.legs = [];
        this.legBaseY = [];
        this.tailParts = [];

        const furMaterial = new THREE.MeshStandardMaterial({ color: furColor, roughness: 0.88 });
        const whiteMaterial = new THREE.MeshStandardMaterial({ color: whiteColor, roughness: 0.9 });
        const eyeMaterial = new THREE.MeshStandardMaterial({ color: 0x080808, roughness: 0.4 });
        const noseMaterial = new THREE.MeshStandardMaterial({ color: noseColor, roughness: 0.5 });

        const body = new THREE.Mesh(
          new THREE.BoxGeometry(0.95, 0.26, 0.35),
          furMaterial
        );
        body.position.set(0, 0.51, 0);
        this.bodyRig.add(body);

        const belly = new THREE.Mesh(
          new THREE.BoxGeometry(0.9, 0.14, 0.3),
          whiteMaterial
        );
        belly.position.set(0.02, 0.4, 0);
        this.bodyRig.add(belly);

        const chest = new THREE.Mesh(
          new THREE.SphereGeometry(0.16, 20, 16),
          whiteMaterial
        );
        chest.scale.set(1.05, 0.95, 1);
        chest.position.set(0.39, 0.46, 0);
        this.bodyRig.add(chest);

        const head = new THREE.Mesh(
          new THREE.SphereGeometry(0.17, 24, 18),
          furMaterial
        );
        head.position.set(0.56, 0.62, 0);
        this.bodyRig.add(head);

        const snout = new THREE.Mesh(
          new THREE.CylinderGeometry(0.075, 0.055, 0.24, 20),
          whiteMaterial
        );
        snout.rotation.z = -Math.PI / 2;
        snout.position.set(0.73, 0.58, 0);
        this.bodyRig.add(snout);

        const nose = new THREE.Mesh(
          new THREE.SphereGeometry(0.04, 14, 12),
          noseMaterial
        );
        nose.position.set(0.86, 0.58, 0);
        this.bodyRig.add(nose);

        const foreheadMarking = new THREE.Mesh(
          new THREE.BoxGeometry(0.08, 0.16, 0.1),
          whiteMaterial
        );
        foreheadMarking.position.set(0.59, 0.67, 0);
        this.bodyRig.add(foreheadMarking);

        const muzzleMarkingLeft = new THREE.Mesh(
          new THREE.SphereGeometry(0.075, 16, 12),
          whiteMaterial
        );
        muzzleMarkingLeft.position.set(0.67, 0.56, 0.08);
        this.bodyRig.add(muzzleMarkingLeft);

        const muzzleMarkingRight = new THREE.Mesh(
          new THREE.SphereGeometry(0.075, 16, 12),
          whiteMaterial
        );
        muzzleMarkingRight.position.set(0.67, 0.56, -0.08);
        this.bodyRig.add(muzzleMarkingRight);

        const earGeometry = new THREE.ConeGeometry(0.055, 0.16, 4);
        const leftEar = new THREE.Mesh(earGeometry, furMaterial);
        leftEar.position.set(0.5, 0.8, 0.1);
        leftEar.rotation.x = -0.2;
        leftEar.rotation.z = -0.07;
        this.bodyRig.add(leftEar);

        const rightEar = new THREE.Mesh(earGeometry, furMaterial);
        rightEar.position.set(0.5, 0.8, -0.1);
        rightEar.rotation.x = 0.2;
        rightEar.rotation.z = -0.07;
        this.bodyRig.add(rightEar);

        const eyeGeometry = new THREE.SphereGeometry(0.019, 10, 8);
        const leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
        leftEye.position.set(0.69, 0.64, 0.07);
        this.bodyRig.add(leftEye);

        const rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
        rightEye.position.set(0.69, 0.64, -0.07);
        this.bodyRig.add(rightEye);

        const legPositions = [
          [0.31, 0.36, 0.12],
          [0.31, 0.36, -0.12],
          [-0.3, 0.36, 0.12],
          [-0.3, 0.36, -0.12]
        ];

        legPositions.forEach(([x, y, z]) => {
          const legPivot = new THREE.Group();
          legPivot.position.set(x, y, z);

          const leg = new THREE.Mesh(
            new THREE.BoxGeometry(0.1, 0.36, 0.1),
            furMaterial
          );
          leg.position.set(0, -0.18, 0);
          legPivot.add(leg);

          const paw = new THREE.Mesh(
            new THREE.BoxGeometry(0.1, 0.08, 0.105),
            whiteMaterial
          );
          paw.position.set(0, -0.36, 0);
          legPivot.add(paw);

          this.group.add(legPivot);
          this.legs.push(legPivot);
          this.legBaseY.push(y);
        });

        const tailSegmentA = new THREE.Mesh(
          new THREE.CylinderGeometry(0.05, 0.045, 0.2, 12),
          furMaterial
        );
        tailSegmentA.position.set(-0.58, 0.64, 0);
        tailSegmentA.rotation.z = 1.2;
        this.bodyRig.add(tailSegmentA);
        this.tailParts.push(tailSegmentA);

        const tailSegmentB = new THREE.Mesh(
          new THREE.CylinderGeometry(0.043, 0.038, 0.17, 12),
          furMaterial
        );
        tailSegmentB.position.set(-0.67, 0.72, 0);
        tailSegmentB.rotation.z = 0.86;
        this.bodyRig.add(tailSegmentB);
        this.tailParts.push(tailSegmentB);

        const tailSegmentC = new THREE.Mesh(
          new THREE.CylinderGeometry(0.036, 0.03, 0.14, 12),
          whiteMaterial
        );
        tailSegmentC.position.set(-0.73, 0.79, 0);
        tailSegmentC.rotation.z = 0.57;
        this.bodyRig.add(tailSegmentC);
        this.tailParts.push(tailSegmentC);

        const tailFluff = new THREE.Mesh(
          new THREE.SphereGeometry(0.05, 14, 10),
          whiteMaterial
        );
        tailFluff.position.set(-0.76, 0.85, 0);
        this.bodyRig.add(tailFluff);
        this.tailParts.push(tailFluff);
      }
    }

    function ensureAudioContext() {
      if (!audioContext) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) {
          return null;
        }
        audioContext = new AudioContextClass();
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }

      return audioContext;
    }

    function getBarkNoiseBuffer(context) {
      if (barkNoiseBuffer && barkNoiseBuffer.sampleRate === context.sampleRate) {
        return barkNoiseBuffer;
      }

      const length = Math.floor(context.sampleRate * 0.22);
      barkNoiseBuffer = context.createBuffer(1, length, context.sampleRate);
      const data = barkNoiseBuffer.getChannelData(0);
      for (let i = 0; i < length; i += 1) {
        const taper = 1 - i / length;
        data[i] = (Math.random() * 2 - 1) * taper;
      }

      return barkNoiseBuffer;
    }

    function playBark({ happy = false, pitchOffset = 0 }) {
      const context = ensureAudioContext();
      if (!context) {
        return;
      }

      const now = context.currentTime;
      const barkDuration = happy ? 0.28 : 0.22;

      const masterGain = context.createGain();
      masterGain.gain.setValueAtTime(0.0001, now);
      masterGain.gain.exponentialRampToValueAtTime(happy ? 0.22 : 0.17, now + 0.02);
      masterGain.gain.exponentialRampToValueAtTime(0.0001, now + barkDuration);
      masterGain.connect(context.destination);

      const oscillator = context.createOscillator();
      oscillator.type = happy ? "triangle" : "square";
      oscillator.frequency.setValueAtTime((happy ? 520 : 420) + pitchOffset * 45, now);
      oscillator.frequency.exponentialRampToValueAtTime((happy ? 250 : 210) + pitchOffset * 20, now + barkDuration);
      oscillator.connect(masterGain);
      oscillator.start(now);
      oscillator.stop(now + barkDuration);

      const noiseSource = context.createBufferSource();
      noiseSource.buffer = getBarkNoiseBuffer(context);
      const noiseFilter = context.createBiquadFilter();
      noiseFilter.type = "bandpass";
      noiseFilter.frequency.setValueAtTime(happy ? 1200 : 900, now);
      noiseFilter.Q.value = 0.9;

      const noiseGain = context.createGain();
      noiseGain.gain.setValueAtTime(happy ? 0.35 : 0.3, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + barkDuration);

      noiseSource.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(masterGain);
      noiseSource.start(now);
      noiseSource.stop(now + barkDuration);
    }

    function rotateYToward(object, targetYaw, rate) {
      const delta = THREE.MathUtils.euclideanModulo(targetYaw - object.rotation.y + Math.PI, Math.PI * 2) - Math.PI;
      object.rotation.y += delta * Math.min(1, rate);
    }

    function showPetText({ text, dog }) {
      const element = document.createElement("div");
      element.className = "pet-feedback";
      element.textContent = text;
      document.body.appendChild(element);

      floatingTexts.push({
        dog,
        element,
        elapsed: 0,
        duration: THREE.MathUtils.randFloat(1.35, 1.8)
      });
    }

    function updateFloatingTexts(deltaSeconds) {
      for (let i = floatingTexts.length - 1; i >= 0; i -= 1) {
        const item = floatingTexts[i];
        item.elapsed += deltaSeconds;

        if (item.elapsed >= item.duration) {
          item.element.remove();
          floatingTexts.splice(i, 1);
          continue;
        }

        tempVector.set(
          item.dog.group.position.x,
          item.dog.group.position.y + 1.25 + item.elapsed * 0.2,
          item.dog.group.position.z
        );
        tempVector.project(camera);

        if (tempVector.z < -1 || tempVector.z > 1) {
          item.element.style.opacity = "0";
          continue;
        }

        const x = (tempVector.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-tempVector.y * 0.5 + 0.5) * window.innerHeight -item.elapsed * 20;
        item.element.style.left = `${x}px`;
        item.element.style.top = `${y}px`;
        item.element.style.opacity = `${1 - item.elapsed / item.duration}`;
      }
    }

    function updatePackStatus(status) {
      if (!status) {
        packStatus.classList.remove("active");
        return;
      }
      packStatus.textContent = status;
      packStatus.classList.add("active");
    }

    class DogAgent {
      constructor({ furColor, startPosition, compliment, pitchOffset }) {
        const husky = new Husky({ furColor });
        this.group = husky.group;
        this.bodyRig = husky.bodyRig;
        this.legs = husky.legs;
        this.legBaseY = husky.legBaseY;
        this.tailParts = husky.tailParts;

        this.group.position.copy(startPosition);
        this.group.rotation.y = Math.random() * Math.PI * 2;
        this.group.userData.dogAgent = this;

        this.compliment = compliment;
        this.pitchOffset = pitchOffset;
        this.walkSpeed = THREE.MathUtils.randFloat(1.0, 1.45);
        this.zoomSpeed = THREE.MathUtils.randFloat(8.0, 12.0);
        this.maxRadius = 12;
        this.state = "pause";
        this.target = new THREE.Vector3(startPosition.x, 0, startPosition.z);
        this.pauseTimer = THREE.MathUtils.randFloat(0.2, 1.1);
        this.petTimer = 0;
        this.walkPhase = Math.random() * Math.PI * 2;
        this.wagPhase = Math.random() * Math.PI * 2;
        this.sitBlend = 0;
        this.legAngles = [0, 0, 0, 0];
        this.nextBarkTime = elapsedSeconds + THREE.MathUtils.randFloat(5, 15);
        this.packPosition = null;
        this.isZooming = false;
        this.zoomTimer = 0;
        this.followDistance = 6; // Distance to follow player

        this.group.traverse((child) => {
          if (!child.isMesh) {
            return;
          }
          child.userData.dogAgent = this;
          dogMeshes.push(child);
        });

        scene.add(this.group);
      }

      setWalkTarget(target) {
        this.target.copy(target);
        this.target.y = 0;
        const distanceToCenter = Math.hypot(this.target.x, this.target.z);
        if (distanceToCenter > this.maxRadius) {
          const clamp = this.maxRadius / distanceToCenter;
          this.target.x *= clamp;
          this.target.z *= clamp;
        }
        this.state = "walk";
      }

      pickRandomTarget(allowFollow = true) {
        if (allowFollow && dogs.length >= 2 && Math.random() < 0.3) {
          this.setFollowTarget();
          return;
        }
        const angle = Math.random() * Math.PI * 2;
        const stepDistance = THREE.MathUtils.randFloat(2.4, 6.3);
        const target = new THREE.Vector3(
          this.group.position.x + Math.cos(angle) * stepDistance,
          0,
          this.group.position.z + Math.sin(angle) * stepDistance
        );
        this.setWalkTarget(target);
      }

      setFollowTarget() {
        tempVector.copy(camera.position);
        tempVector.y = 0;
        
        // Calculate position relative to player's facing direction
        const relativeX = tempVector.x - camera.position.x;
        const relativeZ = tempVector.z - camera.position.z;
        
        const followAngle = Math.atan2(relativeZ, relativeX);
        const actualYaw = yaw + followAngle + Math.PI;
        
        const followX = camera.position.x + Math.cos(actualYaw) * this.followDistance;
        const followZ = camera.position.z + Math.sin(actualYaw) * this.followDistance;
        
        this.target.set(followX, 0, followZ);
        this.state = "follow";
      }

      startPause(minSeconds = 0.55, maxSeconds = 1.8) {
        this.state = "pause";
        this.pauseTimer = THREE.MathUtils.randFloat(minSeconds, maxSeconds);
      }

      pet() {
        this.state = "petted";
        this.petTimer = THREE.MathUtils.randFloat(2.1, 2.9);
        playBark({ happy: true, pitchOffset: this.pitchOffset + 0.6 });
        showPetText({
          text: this.compliment,
          dog: this
        });
      }

      startZoomies() {
        this.isZooming = true;
        this.zoomTimer = THREE.MathUtils.randFloat(3, 6);
        playBark({ happy: true, pitchOffset: this.pitchOffset + 0.8 });
        
        // Pick a target far but still in area
        const angle = Math.random() * Math.PI * 2;
        const stepDistance = THREE.MathUtils.randFloat(8, 15);
        const target = new THREE.Vector3(
          camera.position.x + Math.cos(angle) * stepDistance,
          0,
          camera.position.z + Math.sin(angle) * stepDistance
        );
        
        // Clamp to bounds
        const dist = Math.hypot(target.x, target.z);
        if (dist > this.maxRadius) {
          const clamp = this.maxRadius / dist;
          target.x *= clamp;
          target.z *= clamp;
        }
        
        this.target.copy(target);
        this.state = "zooming";
      }

      resetZoomies() {
        this.isZooming = false;
        this.zoomTimer = 0;
      }

      update(deltaSeconds, nowSeconds) {
        if (nowSeconds >= this.nextBarkTime) {
          if (this.state !== "petted") {
            playBark({ happy: false, pitchOffset: this.pitchOffset + THREE.MathUtils.randFloat(-0.25, 0.25) });
          }
          this.nextBarkTime = nowSeconds + THREE.MathUtils.randFloat(5, 15);
        }

        let isWalking = false;

        if (this.isZooming) {
          this.zoomTimer -= deltaSeconds;
          if (this.zoomTimer <= 0) {
            this.resetZoomies();
            this.state = "pause";
            this.startPause(1, 3);
          }
        }

        if (this.state === "petted") {
          this.petTimer -= deltaSeconds;
          if (this.petTimer <= 0) {
            this.resetZoomies();
            this.startPause(0.35, 1.0);
          }
        } else if (this.state === "follow") {
          tempVector.subVectors(this.target, this.group.position);
          tempVector.y = 0;
          const distanceToTarget = tempVector.length();

          if (distanceToTarget < 0.3) {
            this.startPause(0.5, 1.5);
          } else {
            isWalking = true;
            tempVector.multiplyScalar(1 / distanceToTarget);
            const walkStep = Math.min(distanceToTarget, this.walkSpeed * deltaSeconds);
            this.group.position.addScaledVector(tempVector, walkStep);

            const radialDistance = Math.hypot(this.group.position.x, this.group.position.z);
            if (radialDistance > this.maxRadius) {
              const clamp = this.maxRadius / radialDistance;
              this.group.position.x *= clamp;
              this.group.position.z *= clamp;
            }

            const desiredYaw = Math.atan2(-tempVector.z, tempVector.x);
            rotateYToward(this.group, desiredYaw, deltaSeconds * 7);
          }
        } else if (this.state === "zooming") {
          tempVector.subVectors(this.target, this.group.position);
          tempVector.y = 0;
          const distanceToTarget = tempVector.length();

          if (distanceToTarget < 0.15) {
            this.resetZoomies();
            this.state = "pause";
            this.startPause(0.5, 1.5);
          } else {
            isWalking = true;
            tempVector.multiplyScalar(1 / distanceToTarget);
            const speed = this.zoomSpeed * deltaSeconds;
            this.group.position.addScaledVector(tempVector, Math.min(speed, distance_toTarget));

            const desiredYaw = Math.atan2(-tempVector.z, tempVector.x);
            rotateYToward(this.group, desiredYaw, deltaSeconds * 10);
          }
        } else if (this.state === "pause") {
          this.pauseTimer -= deltaSeconds;
          if (this.pauseTimer <= 0) {
            this.pickRandomTarget(true);
          }
        }

        this.sitBlend = THREE.MathUtils.damp(this.sitBlend, this.state === "petted" ? 1 : 0, 7, deltaSeconds);
        this.bodyRig.position.y = THREE.MathUtils.lerp(0, -0.08, this.sitBlend);
        this.bodyRig.rotation.z = THREE.MathUtils.lerp(0, -0.08, this.sitBlend);

        if (isWalking) {
          this.walkPhase += deltaSeconds * 9;
        }

        const walkSwing = isWalking ? Math.sin(this.walkPhase) * 0.5 : 0;
        const walkTargets = [walkSwing, -walkSwing, -walkSwing, walkSwing];
        const sitTargets = [0.45, 0.45, -1.05, -1.05];

        for (let i = 0; i < this.legs.length; i += 1) {
          const blendedTarget = THREE.MathUtils.lerp(walkTargets[i], sitTargets[i], this.sitBlend);
          this.legAngles[i] = THREE.MathUtils.damp(this.legAngles[i], blendedTarget, 10, deltaSeconds);
          this.legs[i].rotation.x = this.legAngles[i];

          const sitY = i < 2 ? this.legBaseY[i] - 0.03 : this.legBaseY[i] - 0.08;
          this.legs[i].position.y = THREE.MathUtils.lerp(this.legBaseY[i], sitY, this.sitBlend);
        }

        const wagSpeed = this.isZooming ? 25 : THREE.MathUtils.lerp(6.2, 15.5, this.sitBlend);
        const wagAmount = this.isZooming ? 0.6 : THREE.MathUtils.lerp(0.16, 0.38, this.sitBlend);
        this.wagPhase += deltaSeconds * wagSpeed;
        const wagValue = Math.sin(this.wagPhase) * wagAmount;
        const wagScale = [0.55, 0.9, 1.2, 1.5]; // More extreme tail wag when zooming

        for (let i = 0; i < this.tailParts.length; i += 1) {
          this.tailParts[i].rotation.y = wagValue * wagScale[i];
        }
      }
    }

    function pickDog_from_click(event) {
      if (document.pointerLockElement === canvas) {
        clickNdc.set(0, 0);
      } else {
        const rect = canvas.getBoundingClientRect();
        clickNdc.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        clickNdc.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      }

      raycaster.setFromCamera(clickNdc, camera);
      const hits = raycaster.intersectObjects(dogMeshes, false);

      for (let i = 0; i < hits.length; i += 1) {
        const dog = hits[i].object.userData.dogAgent;
        if (dog) {
          return dog;
        }
      }

      return null;
    }

    function try_petDog_from_click(event) {
      const dog = pickDog_from_click(event);
      if (!dog) {
        return null;
      }
      dog.pet();
      return dog;
    }

    function trigger_zoomies_together() {
      if (dogs.length < 2) {
        return;
      }

      updatePackStatus("🐕 ZOOMIES! Running together!");
      
      // All dogs start zoomies together
      dogs.forEach(dog => {
        dog.startZoomies();
      });
    }

    function triggerPackHuddle() {
      if (dogs.length < 2) {
        return;
      }

      updatePackStatus("🐕🐕🐕 Pack huddling up!");
      
      // Calculate pack center
      let centerX = 0, centerZ = 0;
      dogs.forEach(dog => {
        centerX += dog.group.position.x;
        centerZ += dog.group.position.z;
      });
      centerX /= dogs.length;
      centerZ /= dogs.length;

      const packCenterPoint = new THREE.Vector3(centerX, 0, centerZ);
      const distanceBetween = 2;

      dogs.forEach((dog, index) => {
        const angle = (index / dogs.length) * Math.PI * 2;
        const target = new THREE.Vector3(
          packCenterPoint.x + Math.cos(angle) * distanceBetween,
          0,
          packCenterPoint.z + Math.sin(angle) * distanceBetween
        );
        
        // Clamp to bounds
        const dist = Math.hypot(target.x, target.z);
        if (dist > dog.maxRadius) {
          const clamp = dog.maxRadius / dist;
          target.x *= clamp;
          target.z *= clamp;
        }
        
        dog.setWalkTarget(target);
      });
    }

    function triggerPackFollow() {
      if (dogs.length < 2) {
        return;
      }

      updatePackStatus("🐕 Pack following you!");
      
      dogs.forEach((dog, index) => {
        // Stagger the dogs so they don't all follow the exact same spot
        const offsetAngle = (index - (dogs.length - 1) / 2) * 0.5;
        dog.followDistance += offsetAngle;
        dog.setFollowTarget();
      });
    }

    // Create 3 dogs with different personalities
    const femaleHusky = new DogAgent({
      furColor: 0x1f2129,
      startPosition: new THREE.Vector3(-3.2, 0, -2.3),
      compliment: "Good girl!",
      pitchOffset: 0.18
    });
    dogs.push(femaleHusky);

    const maleHusky = new DogAgent({
      furColor: 0xa75b32,
      startPosition: new THREE.Vector3(2.6, 0, 1.8),
      compliment: "Good boy!",
      pitchOffset: -0.12
    });
    dogs.push(maleHusky);

    const playfulPup = new DogAgent({
      furColor: 0x5a5f6c,
      startPosition: new THREE.Vector3(0, 0, 0),
      compliment: "Good pup!",
      pitchOffset: 0.08
    });
    dogs.push(playfulPup);

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener("resize", onWindowResize);

    function animate() {
      requestAnimationFrame(animate);
      const deltaSeconds = clock.getDelta();
      elapsedSeconds += deltaSeconds;
      updateMovement(deltaSeconds);

      // Trigger zoomies randomly
      if (elapsedSeconds >= nextZoomieTime && dogs.length >= 2) {
        if (Math.random() < 0.85) {
          trigger_zoomies_together();
        }
        nextZoomieTime = elapsedSeconds + THREE.MathUtils.randFloat(20, 35);
      }

      // Trigger pack follow behavior
      if (elapsedSeconds >= nextFollowRepositionTime) {
        if (Math.random() < 0.7) {
          triggerPackFollow();
        }
        nextFollowRepositionTime = elapsedSeconds + THREE.MathUtils.randFloat(25, 40);
      }

      // Trigger pack huddle every 30-50 seconds
      if (Math.random() < 0.01 && dogs.length >= 3) {
        triggerPackHuddle();
        setTimeout(() => updatePackStatus(""), 2000);
      }

      dogs.forEach((dog) => {
        dog.update(deltaSeconds, elapsedSeconds);
      });
      updateFloatingTexts(deltaSeconds);

      renderer.render(scene, camera);
    }

    animate();
  </script>
