<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Husky World</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.161.0/build/three.module.js";

    const scene = new THREE.Scene();

    const skyCanvas = document.createElement("canvas");
    skyCanvas.width = 2;
    skyCanvas.height = 512;
    const skyContext = skyCanvas.getContext("2d");
    const skyGradient = skyContext.createLinearGradient(0, 0, 0, skyCanvas.height);
    skyGradient.addColorStop(0, "#7ec5f3");
    skyGradient.addColorStop(1, "#dff3ff");
    skyContext.fillStyle = skyGradient;
    skyContext.fillRect(0, 0, skyCanvas.width, skyCanvas.height);
    const skyTexture = new THREE.CanvasTexture(skyCanvas);
    skyTexture.colorSpace = THREE.SRGBColorSpace;
    scene.background = skyTexture;
    scene.fog = new THREE.Fog(0xc8e4f5, 60, 240);

    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(0, 1.7, 0);
    camera.lookAt(0, 1.7, -1);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
    directionalLight.position.set(5, 10, 5);
    scene.add(directionalLight);

    const grassCanvas = document.createElement("canvas");
    grassCanvas.width = 256;
    grassCanvas.height = 256;
    const grassContext = grassCanvas.getContext("2d");
    grassContext.fillStyle = "#68a349";
    grassContext.fillRect(0, 0, grassCanvas.width, grassCanvas.height);
    for (let i = 0; i < 900; i += 1) {
      const shade = 80 + Math.floor(Math.random() * 70);
      grassContext.fillStyle = `rgb(${30 + Math.floor(Math.random() * 25)}, ${shade}, ${25 + Math.floor(Math.random() * 20)})`;
      const x = Math.floor(Math.random() * grassCanvas.width);
      const y = Math.floor(Math.random() * grassCanvas.height);
      grassContext.fillRect(x, y, 2, 2);
    }
    const grassTexture = new THREE.CanvasTexture(grassCanvas);
    grassTexture.colorSpace = THREE.SRGBColorSpace;
    grassTexture.wrapS = THREE.RepeatWrapping;
    grassTexture.wrapT = THREE.RepeatWrapping;
    grassTexture.repeat.set(90, 90);
    grassTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(300, 300),
      new THREE.MeshStandardMaterial({
        color: 0x6ca34a,
        map: grassTexture,
        roughness: 0.96,
        metalness: 0.0
      })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    scene.add(ground);

    const marker = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshStandardMaterial({ color: 0xcc5533 })
    );
    marker.position.set(0, 0.5, -5);
    scene.add(marker);

    const trunkGeometry = new THREE.CylinderGeometry(0.2, 0.28, 2.2, 6);
    const foliageGeometry = new THREE.ConeGeometry(1.35, 3.6, 7);

    const trunkMaterials = [
      new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 0.95 }),
      new THREE.MeshStandardMaterial({ color: 0x7b4f2f, roughness: 0.95 }),
      new THREE.MeshStandardMaterial({ color: 0x8a5a34, roughness: 0.95 })
    ];

    const foliageMaterials = [
      new THREE.MeshStandardMaterial({ color: 0x2f7c31, roughness: 0.88 }),
      new THREE.MeshStandardMaterial({ color: 0x3a8a39, roughness: 0.88 }),
      new THREE.MeshStandardMaterial({ color: 0x4a9942, roughness: 0.88 })
    ];

    function createTree() {
      const tree = new THREE.Group();

      const trunk = new THREE.Mesh(
        trunkGeometry,
        trunkMaterials[Math.floor(Math.random() * trunkMaterials.length)]
      );
      trunk.position.y = 1.1;
      tree.add(trunk);

      const foliage = new THREE.Mesh(
        foliageGeometry,
        foliageMaterials[Math.floor(Math.random() * foliageMaterials.length)]
      );
      foliage.position.y = 3.4;
      foliage.rotation.y = Math.random() * Math.PI * 2;
      tree.add(foliage);

      const scale = THREE.MathUtils.randFloat(0.8, 1.3);
      tree.scale.setScalar(scale);

      return tree;
    }

    const treeCount = THREE.MathUtils.randInt(30, 50);
    for (let i = 0; i < treeCount; i += 1) {
      const angle = Math.random() * Math.PI * 2;
      const radius = THREE.MathUtils.randFloat(30, 90);
      const tree = createTree();
      tree.position.set(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
      tree.rotation.y = Math.random() * Math.PI * 2;
      scene.add(tree);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener("resize", onWindowResize);

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
